<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090c"><title>EnuFlix</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090c;color:#fff;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}.nav{height:68px;display:flex;align-items:center;gap:24px;padding:0 4vw;position:sticky;top:0;z-index:20;background:#08090cf2;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff0b}.logo{font-size:30px;font-weight:950;letter-spacing:-2px}.logo b{color:#e50914}.links{display:flex;gap:18px}.links button{border:0;background:none;color:#b7bac2;font-weight:750;cursor:pointer}.links button:hover{color:#fff}.search{margin-left:auto;background:#161820;border:1px solid #ffffff20;color:#fff;border-radius:24px;padding:10px 16px;width:min(300px,30vw)}.hero{height:68vh;min-height:520px;background:#151820 center/cover no-repeat;display:flex;align-items:end;position:relative}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#08090c 0,#08090cc7 38%,transparent 72%),linear-gradient(0deg,#08090c,transparent 50%)}.hc{position:relative;z-index:2;padding:0 5vw 72px;max-width:720px}.hc h1{font-size:clamp(48px,7vw,82px);line-height:.93;letter-spacing:-4px;margin:10px 0 18px}.hc p{color:#d0d3da;line-height:1.6;font-size:16px}.meta{font-weight:800;color:#e1e3e8}.main{padding:0 4vw 70px}.sec{margin:25px 0 36px}.sec h2{font-size:23px;margin:0 0 14px}.row{display:grid;grid-template-columns:repeat(20,150px);gap:12px;overflow-x:auto;padding:2px 0 13px;scrollbar-width:thin}.card{cursor:pointer;transition:.18s}.card:hover{transform:translateY(-5px)}.poster{height:225px;border-radius:10px;background:#171a21 center/cover no-repeat;box-shadow:0 8px 25px #0006}.title{font-size:14px;font-weight:800;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:11px;color:#8f949f;margin-top:3px}.state{min-height:70vh;display:grid;place-items:center;color:#9ca1ab;padding:30px;text-align:center}.modal{position:fixed;inset:0;z-index:50;background:#000d;display:grid;place-items:center;padding:18px;backdrop-filter:blur(9px)}.box{width:min(880px,96vw);max-height:90vh;overflow:auto;background:#12141a;border:1px solid #ffffff15;border-radius:22px;overflow:hidden}.cover{height:330px;background:#20232b center/cover}.body{padding:28px 34px}.body h1{font-size:42px;letter-spacing:-2px;margin:5px 0 12px}.body p{color:#c8cbd2;line-height:1.65}.close{float:right;border:0;background:#292c35;color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px}.foot{border-top:1px solid #ffffff12;padding:35px 4vw;color:#777;font-size:13px}
@media(max-width:760px){.links{display:none}.search{width:47vw}.hero{height:60vh}.hc{padding:0 18px 55px}.hc h1{letter-spacing:-2px}.main{padding:0 15px 55px}.row{grid-template-columns:repeat(20,135px)}.poster{height:203px}.body{padding:22px}.body h1{font-size:32px}}
</style></head><body><div id="app"><div class="state">Loading EnuFlix catalog…</div></div>
<script>
const API="https://soxnczzompioufrgtxqp.supabase.co/functions/v1/enuflix",A=document.getElementById("app");let HOME;
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nav=()=>'<header class="nav"><div class="logo">Enu<b>Flix</b></div><div class="links"><button data-view="home">Home</button><button data-view="movies">Movies</button><button data-view="tv">TV Shows</button><button data-view="top">Top 10</button><button data-view="discover">Discover</button></div><input id="search" class="search" placeholder="Search movies & shows"></header>';
const card=x=>'<article class="card" data-id="'+x.id+'" data-type="'+x.type+'"><div class="poster" style="background-image:url(\''+(x.poster||"")+'\')"></div><div class="title">'+esc(x.title)+'</div><div class="sub">'+esc((x.date||"").slice(0,4))+' · ★ '+Number(x.rating||0).toFixed(1)+'</div></article>';
function bind(){document.querySelectorAll(".card").forEach(e=>e.onclick=()=>detail(e.dataset.type,e.dataset.id));document.querySelectorAll("[data-view]").forEach(e=>e.onclick=()=>view(e.dataset.view));const q=document.getElementById("search");if(q)q.onkeydown=e=>{if(e.key==="Enter"&&q.value.trim())search(q.value.trim())}}
async function get(path){const r=await fetch(API+path);if(!r.ok)throw Error(r.status);return r.json()}
function sections(ss){return '<main class="main">'+ss.map(s=>'<section class="sec"><h2>'+esc(s[0])+'</h2><div class="row">'+s[1].slice(0,20).map(card).join("")+'</div></section>').join("")+'</main>'}
function render(h){HOME=h;const f=h.featured?.[0];if(!f)throw Error("No catalog");A.innerHTML=nav()+'<section class="hero" style="background-image:url(\''+(f.backdrop||"")+'\')"><div class="hc"><div class="meta">★ '+Number(f.rating||0).toFixed(1)+' · '+esc((f.date||"").slice(0,4))+' · '+esc(f.type)+'</div><h1>'+esc(f.title)+'</h1><p>'+esc(f.overview)+'</p></div></section>'+sections(h.sections)+'<footer class="foot">EnuFlix · Movie & TV discovery · Metadata powered by TMDB.</footer>';bind()}
function view(v){if(!HOME)return;if(v==="home")return render(HOME);let ss=HOME.sections;if(v==="movies")ss=ss.filter(s=>/Movies|Rated|Action|Comedy|Sci-Fi/.test(s[0]));if(v==="tv")ss=ss.filter(s=>/TV|Drama|Series/.test(s[0]));if(v==="top")ss=[["Top 10",HOME.sections.flatMap(s=>s[1]).sort((a,b)=>b.rating-a.rating).slice(0,10)]];if(v==="discover")ss=[["Discover",HOME.sections.flatMap(s=>s[1]).sort(()=>Math.random()-.5).slice(0,20)]];A.innerHTML=nav()+'<div style="height:25px"></div>'+sections(ss);bind()}
async function search(q){A.innerHTML=nav()+'<div class="state">Searching…</div>';bind();try{const d=await get("/api/search?q="+encodeURIComponent(q));A.innerHTML=nav()+'<div style="height:25px"></div>'+sections([['Search: “'+q+'”',d.results||[]]]);bind()}catch{A.innerHTML=nav()+'<div class="state">Search is temporarily unavailable.</div>';bind()}}
async function detail(type,id){try{const x=await get("/api/detail?type="+encodeURIComponent(type)+"&id="+encodeURIComponent(id)),d=document.createElement("div");d.className="modal";d.innerHTML='<div class="box"><div class="cover" style="background-image:url(\'https://image.tmdb.org/t/p/w1280'+(x.backdrop_path||"")+'\')"></div><div class="body"><button class="close">×</button><div class="meta">★ '+Number(x.vote_average||0).toFixed(1)+' · '+esc((x.release_date||x.first_air_date||"").slice(0,4))+'</div><h1>'+esc(x.title||x.name)+'</h1><p>'+esc(x.overview)+'</p><div class="meta">'+(x.genres||[]).map(g=>esc(g.name)).join(" · ")+'</div></div></div>';document.body.appendChild(d);d.querySelector(".close").onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove()}}catch{alert("Details are temporarily unavailable.")}}
get("/api/home").then(render).catch(()=>A.innerHTML='<div class="state"><div><h2>EnuFlix</h2><p>The catalog API is temporarily unavailable. Please refresh shortly.</p></div></div>');
</script></body></html>
